<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AeroBridge Map</title>
<link rel="stylesheet" href="leaflet.css" />
<script src="leaflet.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; }

    #map {
        width: 100%;
        height: 100vh;
    }

    .ownship-icon {
        width: 20px; height: 20px;
        background: #00ff00;
        border: 2px solid #fff;
        border-radius: 50%;
        box-shadow: 0 0 12px #00ff00, 0 0 24px rgba(0,255,0,0.3);
    }

    .traffic-icon {
        width: 16px; height: 16px;
        background: #ff9800;
        border: 1px solid #fff;
        border-radius: 50%;
    }

    .label-popup {
        font-size: 11px;
        color: #fff;
    }

    /* 自定义 Leaflet popup 样式 */
    .leaflet-popup-content-wrapper {
        background: rgba(26, 26, 26, 0.95);
        color: #e0e0e0;
        border: 1px solid #444;
        border-radius: 4px;
    }
    .leaflet-popup-tip {
        background: rgba(26, 26, 26, 0.95);
    }
    .leaflet-popup-content {
        font-size: 12px;
        font-family: 'Consolas', monospace;
        color: #e0e0e0;
    }
    .leaflet-popup-content b {
        color: #4CAF50;
    }
</style>
</head>
<body>
<div id="map"></div>
<script>
"use strict";

// ============================================================
// 地图初始化
// ============================================================
var map = L.map("map", {
    zoomControl: true,
    attributionControl: true
}).setView([39.9042, 116.4074], 10);  // 默认北京

// 深色瓦片（CartoDB Dark Matter）
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution: "&copy; OpenStreetMap contributors &copy; CARTO",
    subdomains: "abcd",
    maxZoom: 19
}).addTo(map);

// 地图初始化完成


// ============================================================
// 全局状态
// ============================================================
var ownshipMarker = null;
var ownshipPopup = null;
var trafficMarkers = {};
var autoFollow = true;  // 地图是否自动跟随自己的飞机


// ============================================================
// 更新自己的位置
// ============================================================
window.updateOwnship = function(data) {
    if (!data || typeof data.lat !== "number" || typeof data.lon !== "number") {
        return;
    }

    var latlng = [data.lat, data.lon];

    // 记录自己的 callsign，供 updateTraffic 过滤使用
    window.ownshipCallsign = (data.callsign || "").toUpperCase().trim();

    if (ownshipMarker) {
        // 更新已有标记位置
        ownshipMarker.setLatLng(latlng);
    } else {
        // 创建新标记
        var icon = L.divIcon({
            className: "ownship-icon",
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });
        ownshipMarker = L.marker(latlng, { icon: icon }).addTo(map);
    }

    // 构造 popup 内容
    var callsign = data.callsign || "OWN";
    var altText = (typeof data.alt_ft === "number") ? data.alt_ft.toFixed(0) : "---";
    // 地速：极小值视为 0（地面静止时 DLL 可能返回接近 0 的 m/s）
    var gsNum = parseFloat(data.gs);
    var gsText = (isFinite(gsNum) && gsNum >= 1) ? gsNum.toFixed(0) : "0";
    var hdgText = (typeof data.hdg === "number") ? data.hdg.toFixed(0) : "---";

    var popupHtml =
        "<div class='label-popup'>" +
        "<b>" + callsign + "</b><br>" +
        "高度: " + altText + " ft<br>" +
        "地速: " + gsText + " kts<br>" +
        "航向: " + hdgText + "°" +
        "</div>";

    // 先彻底关闭并解绑旧 popup，再绑定新 popup，避免叠加
    if (ownshipPopup) {
        ownshipMarker.closePopup();
        ownshipMarker.unbindPopup();
        ownshipPopup = null;
    }
    ownshipPopup = ownshipMarker.bindPopup(popupHtml, {
        autoClose: false,
        closeOnClick: false,
        closeButton: false
    }).openPopup();

    // 地图自动跟随
    if (autoFollow) {
        map.panTo(latlng, { animate: true, duration: 0.5 });
    }
};


// ============================================================
// 更新其他飞机
// ============================================================
window.updateTraffic = function(traffic) {
    if (!Array.isArray(traffic)) {
        return;
    }

    // 过滤掉自己的飞机（避免服务器回传导致重复标牌）
    var ownship = (window.ownshipCallsign || "").toUpperCase().trim();
    var filtered = traffic.filter(function(ac) {
        var cs = (ac.callsign || "").toUpperCase().trim();
        return cs && cs !== ownship;
    });

    // 构建当前在线飞机 ID 集合
    var currentIds = {};
    filtered.forEach(function(ac) {
        var id = ac.callsign || ("unknown_" + ac.lat + "_" + ac.lon);
        currentIds[id] = true;

        var latlng = [ac.lat, ac.lon];

        if (trafficMarkers[id]) {
            // 更新已有标记
            trafficMarkers[id].marker.setLatLng(latlng);
        } else {
            // 创建新标记
            var icon = L.divIcon({
                className: "traffic-icon",
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });
            var marker = L.marker(latlng, { icon: icon }).addTo(map);

            // popup 内容
            var altText = ac.alt_ft ? ac.alt_ft : "---";
            var gsText = ac.gs ? ac.gs : "---";
            var hdgText = ac.hdg ? ac.hdg : "---";
            var distText = ac.distance_nm ? ac.distance_nm.toFixed(1) + "nm" : "";

            var popupHtml =
                "<div class='label-popup'>" +
                "<b>" + id + "</b><br>" +
                "高度: " + altText + " ft<br>" +
                "地速: " + gsText + " kts<br>" +
                "航向: " + hdgText + "°" +
                (distText ? "<br>距离: " + distText : "") +
                "</div>";

            marker.bindPopup(popupHtml, { autoClose: true });
            trafficMarkers[id] = { marker: marker };
        }
    });

    // 移除已离线的飞机
    for (var id in trafficMarkers) {
        if (!currentIds[id]) {
            map.removeLayer(trafficMarkers[id].marker);
            delete trafficMarkers[id];
        }
    }
};


// ============================================================
// 地图交互控制
// ============================================================

// 点击地图时暂停自动跟随（用户手动浏览地图）
map.on("mousedown", function() {
    autoFollow = false;
});

// 双击地图恢复自动跟随
map.on("dblclick", function() {
    autoFollow = true;
    if (ownshipMarker) {
        map.panTo(ownshipMarker.getLatLng(), { animate: true, duration: 0.5 });
    }
});

// 键盘快捷键
document.addEventListener("keydown", function(e) {
    if (e.key === "f" || e.key === "F") {
        // 按 F 键聚焦自己
        autoFollow = true;
        if (ownshipMarker) {
            map.panTo(ownshipMarker.getLatLng(), { animate: true, duration: 0.5 });
        }
    }
});
</script>
</body>
</html>
